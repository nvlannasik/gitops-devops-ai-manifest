# The stg bridge (multi-cluster 2a, spec devops-ai-agent/docs/superpowers/specs/2026-11-02-multi-cluster-
# routing-design.md §7): devops-mcp-server alone, TRANSPORT=sqs, so the central agent on dev reads this
# cluster's Kubernetes with no inbound connection. Read-only at first. Standalone rather than a patch of
# the base devops-ai-stack, which carries dev's secrets, stores and write policy.
#
# Two Secrets in devops-tools are the user's to create, never this repo's (the same pair the lab2 bridge
# uses): `aws-rolesanywhere-config` (trust-anchor-arn, profile-arn, role-arn) and `workload-tls` (the
# IAM Roles Anywhere client certificate). The stg clock must be in sync, or SigV4 signing is refused.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: devops-mcp-bridge
  namespace: flux-app
spec:
  targetNamespace: devops-tools
  chart:
    spec:
      chart: devops-ai-stack
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: github
        namespace: flux-system
      version: "0.8.1"
  interval: 5m
  timeout: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      postgresql:
        enabled: false
      redis:
        enabled: false
    devops-ai-agent:
      enabled: false
    devops-llm-worker:
      enabled: false
    devops-mcp-server:
      enabled: true
      image:
        registry: docker.io
        repository: nvlannasik/devops-mcp-server
        tag: latest
        pullPolicy: Always
      # HTTP, not the SQS bridge: dev reaches stg over the LAN (in production, a peered network),
      # so the cluster needs no AWS identity — its IAM Roles Anywhere certificate expiring took the
      # bridge down on 2026-11-04.
      mcp:
        transport: "http"
      kubernetes:
        authMode: "incluster"
      writeTools:
        enabled: true
        allowedNamespaces:
          - default
          - flux-system
          - monitoring
          - devops-tools
      rbac:
        create: true
        readOnly: true
        allowWrite: true
        allowFluxReconcile: true
        # cordon / uncordon / drain (chart 0.8.1): patch nodes, create evictions. The tools refuse the
        # control plane and the last schedulable node; drain evicts, so PDBs still decide.
        allowNodeOps: true
        # `allowOrphanDelete` is false on stg: the bridge serves write tools for live remediation
        # (image bumps, scaling, resource tuning, pod deletes, config patches, Flux reconciles),
        # but ConfigMap and other orphan deletes are deliberately held back. Dev's measured cases
        # (long-stale test resources) justify it there; stg has no measured orphans yet. The tool's
        # safety rails still hold: Flux/Helm owners, workload replicas, age gates, and backups on
        # the remediation row and Slack thread. Once stg accumulates orphans, set allowOrphanDelete: true.
        allowOrphanDelete: false
      env:
        NODE_ENV: "stg"
        # TEST ONLY — NO AUTH. An empty token leaves the server open (it logs a warning), and
        # declaring the key is what gets this past the chart's token check, which exists to stop
        # exactly this: anyone on the LAN can call stg's write tools through NodePort 30300.
        # Before this cluster is more than a lab: authTokenSecret {name: devops-mcp-auth, key:
        # MCP_AUTH_TOKEN} holding the agent's token, and drop this line.
        MCP_AUTH_TOKEN: ""
