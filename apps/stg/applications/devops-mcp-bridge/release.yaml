# The stg bridge (multi-cluster 2a, spec devops-ai-agent/docs/superpowers/specs/2026-11-02-multi-cluster-
# routing-design.md §7): devops-mcp-server alone, TRANSPORT=sqs, so the central agent on dev reads this
# cluster's Kubernetes with no inbound connection. Read-only at first. Standalone rather than a patch of
# the base devops-ai-stack, which carries dev's secrets, stores and write policy.
#
# Two Secrets in devops-tools are the user's to create, never this repo's (the same pair the lab2 bridge
# uses): `aws-rolesanywhere-config` (trust-anchor-arn, profile-arn, role-arn) and `workload-tls` (the
# IAM Roles Anywhere client certificate). The stg clock must be in sync, or SigV4 signing is refused.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: devops-mcp-bridge
  namespace: flux-app
spec:
  targetNamespace: devops-tools
  chart:
    spec:
      chart: devops-ai-stack
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: github
        namespace: flux-system
      version: "0.8.0"
  interval: 5m
  timeout: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      postgresql:
        enabled: false
      redis:
        enabled: false
      aws:
        region: "ap-southeast-1"
        authMode: "iam-anywhere"
        rolesAnywhere:
          configSecret:
            name: aws-rolesanywhere-config
          trustAnchorArnKey: "trust-anchor-arn"
          profileArnKey: "profile-arn"
          roleArnKey: "role-arn"
        certificate:
          create: false
          secretName: "workload-tls"
          mountPath: "/certs"
    devops-ai-agent:
      enabled: false
    devops-llm-worker:
      enabled: false
    devops-mcp-server:
      enabled: true
      image:
        registry: docker.io
        repository: nvlannasik/devops-mcp-server
        tag: latest
        pullPolicy: Always
      mcp:
        transport: "sqs"
      kubernetes:
        authMode: "incluster"
      aws:
        enabled: true
      writeTools:
        enabled: false
      # TRANSPORT=sqs has no HTTP server, so the chart's /health probes killed it every minute. Health is
      # the bridge's heartbeat file (devops-mcp-server CLAUDE.md), the same probe the lab2 bridge runs with.
      livenessProbe:
        enabled: true
        httpGet: null
        exec:
          command: ["sh", "-c", "find /tmp/bridge-heartbeat -mmin -2 | grep -q ."]
        initialDelaySeconds: 60
        periodSeconds: 30
        failureThreshold: 3
      readinessProbe:
        enabled: false
      rbac:
        create: true
        readOnly: true
      # The mcp-server template mounts the IAM Roles Anywhere certificate (aws.enabled) but, unlike the
      # agent's and the worker's, renders no AWS env — so it is set here, the same names the lab2 bridge
      # runs with. Fold into the chart (devops-ai.awsEnv in mcp-server's deployment) on its next release.
      env:
        NODE_ENV: "stg"
        MCP_SQS_REQUEST_QUEUE: "devops-mcp-stg-request.fifo"
        MCP_SQS_RESPONSE_QUEUE: "devops-mcp-response.fifo"
        AWS_REGION: "ap-southeast-1"
        AWS_AUTH_MODE: "iam-anywhere"
        CERT_PATH: "/certs/tls.crt"
        CERT_KEY_PATH: "/certs/tls.key"
      secretEnv:
        AWS_TRUST_ANCHOR_ARN: { secret: aws-rolesanywhere-config, key: trust-anchor-arn }
        AWS_ROLESANYWHERE_PROFILE_ARN: { secret: aws-rolesanywhere-config, key: profile-arn }
        AWS_ROLE_ARN: { secret: aws-rolesanywhere-config, key: role-arn }
