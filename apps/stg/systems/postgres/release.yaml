apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: flux-system
spec:
  values:
    image:
      tag: latest
    auth:
      username: postgres
      password: postgres
      postgresPassword: postgres
      # The sample apps' database. Bitnami creates it only on the first init of an empty volume,
      # and only when it is named here — dev's was made by hand.
      database: sample_app
