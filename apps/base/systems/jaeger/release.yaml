apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jaeger
  namespace: flux-system
spec:
  targetNamespace: monitoring
  chart:
    spec:
      chart: jaeger
      reconcileStrategy: Revision
      sourceRef:
        kind: HelmRepository
        name: jaegertracing
      version: "4.12.0"
  interval: 5m0s
  install:
    remediation:
      retries: 3
    createNamespace: true
  values:
    # Chart 4.x is Jaeger v2: ONE all-in-one Deployment, not the v1
    # agent/collector/query split. The Service it renders is named after this,
    # so devops-mcp-server's TRACING_URL points at jaeger.monitoring:16686.
    fullnameOverride: "jaeger"

    # userconfig REPLACES the image's built-in config, so this is the whole
    # collector pipeline. Trimmed from the upstream default for a k3s node:
    #  - memory storage, one store (upstream ships two at 100k traces each)
    #  - OTLP only (the jaeger/zipkin thrift receivers are legacy protocols)
    #  - no adaptive sampling / remote_sampling: it needs a sampling store
    #  - no pprof
    # Traces are LOST on restart. That is the trade for no PVC; swap the
    # storage backend for badger + a volume if retention starts to matter.
    userconfig:
      service:
        extensions: [jaeger_storage, jaeger_query, healthcheckv2]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [jaeger_storage_exporter]
        telemetry:
          resource:
            service.name: jaeger
          metrics:
            level: basic
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: 0.0.0.0
                      port: 8888
          logs:
            level: info

      extensions:
        healthcheckv2:
          use_v2: true
          # The chart's liveness/readiness probes hit 13133 — stated here
          # because userconfig replaces the default that opened it.
          http:
            endpoint: 0.0.0.0:13133
        jaeger_query:
          storage:
            traces: main_store
        jaeger_storage:
          backends:
            main_store:
              memory:
                # The memory ceiling in practice: everything is on the heap.
                max_traces: 10000

      receivers:
        otlp:
          protocols:
            # 0.0.0.0 stated explicitly — the collector defaults receivers to
            # localhost, which would refuse spans from every other pod.
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        batch:

      exporters:
        jaeger_storage_exporter:
          trace_storage: main_store

    jaeger:
      replicas: 1
      podAnnotations:
        # The chart scrapes 8888 by default. Nothing in this stack reads
        # Jaeger's own collector metrics yet, so don't pay for the series.
        prometheus.io/scrape: "false"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 320Mi
