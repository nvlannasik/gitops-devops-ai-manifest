# Loki Ruler alerting rules. Delivered by the loki-sc-rules sidecar that the
# chart already runs (it watches ConfigMaps carrying the `loki_rule` label and
# writes them into the volume it shares with the Loki container), so nothing new
# is scheduled for this.
#
# It lives in flux-system rather than monitoring only because the kustomization
# above it sets that namespace on everything; `sidecar.rules.searchNamespace`
# in release.yaml is what points the sidecar here, and the chart's ClusterRole
# already grants configmap reads cluster-wide.
#
# Thresholds are tuned for reproducing incidents, not for production parity:
# 0.01 lines/sec is one line every 100 seconds, so a handful of error lines is
# enough to fire. `for: 2m` keeps a benchmark iteration short.
#
# Log shape comes from `createLogger` in @sample-app/platform: one JSON object
# per line with `ts`, `level`, `service`, `version`, `msg`, and `err` when an
# error was attached. Every `msg =` below is a string that exists in the source.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rules
  labels:
    loki_rule: "1"
data:
  sample-apps.yaml: |
    groups:
      - name: sample-apps-logs
        interval: 1m
        rules:
          - alert: AppErrorLogSpike
            expr: |
              sum by (namespace, service, pod) (
                rate({namespace="sample-apps"} | json | level = "error" | msg != "unhandled route error" | msg != "failed to claim a batch" | msg != "migration failed" | msg != "schema is behind the code" | msg !~ ".*refusing to start.*" [5m])
              ) > 0.01
            for: 2m
            labels:
              severity: warning
              source: loki
            annotations:
              summary: "Error log spike in `{{ $labels.service }}` at `Dev cluster`"
              description: "Pod `{{ $labels.pod }}` is logging errors that never became an HTTP status and that no more specific rule claimed. Read the log, there is no metric for this one. :pedro:"