apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluentbit
  namespace: flux-system
spec:
  targetNamespace: monitoring
  chart:
    spec:
      chart: fluent-bit
      reconcileStrategy: Revision
      sourceRef:
        kind: HelmRepository
        name: fluent-bit
      version: "0.57.9"
  interval: 5m0s
  install:
    remediation:
      retries: 3
    createNamespace: true
  values:
    nameOverride: "fluentbit"
    fullnameOverride: "fluentbit"
    config:
      service: |
        [SERVICE]
            Flush         5
            Log_Level     info
            Daemon        off
            Parsers_File  parsers.conf
            HTTP_Server   On
            HTTP_Listen   0.0.0.0
            HTTP_PORT     2020
            Health_Check  On

      # multiline.parser cri, NOT "Parser docker": k3s runs containerd, whose
      # log lines are CRI ("<time> stdout F <msg>"), not Docker JSON. The docker
      # parser is Format json, so it failed on every line and shipped the raw
      # text -- CRI prefix included -- with the ingest time as the timestamp and
      # no stream field for the label the OUTPUT section asks for.
      #
      # It is the MULTILINE cri parser and not parsers.conf's "Parser cri": the
      # multiline one captures the body as `log`, which is the key the kubernetes
      # filter's Merge_Log below reads; parsers.conf's captures `message`, which
      # Merge_Log cannot see. It also rejoins the partial lines containerd splits
      # at 16k (the "P" logtag), which Skip_Long_Lines would otherwise drop.
      #
      # Comments live out here rather than inside the block scalar: anything in
      # there is copied into the ConfigMap and shipped to every node.
      inputs: |
        [INPUT]
            Name              tail
            Path              /var/log/containers/*.log
            Exclude_Path      /var/log/containers/fluentbit*.log
            multiline.parser  cri
            Tag               kube.*
            DB                /var/log/flb_kube.db
            Refresh_Interval  5
            Mem_Buf_Limit     5MB
            Skip_Long_Lines   On

      filters: |
        [FILTER]
            Name                kubernetes
            Match               kube.*
            Kube_URL            https://kubernetes.default.svc:443
            Merge_Log           On
            Keep_Log            Off
            K8S-Logging.Parser  On
            K8S-Logging.Exclude On

      outputs: |
        [OUTPUT]
            Name        loki
            Match       kube.*
            Host        loki.monitoring.svc.cluster.local
            Port        3100
            Labels      job=fluentbit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name'], stream=$stream
            Remove_keys kubernetes
            Auto_kubernetes_labels off

    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi