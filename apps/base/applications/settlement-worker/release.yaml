apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: settlement-worker
  namespace: flux-app
spec:
  targetNamespace: sample-apps
  chart:
    spec:
      chart: main
      reconcileStrategy: Revision
      sourceRef:
        kind: HelmRepository
        name: github
        namespace: flux-system
  interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
    - paths: ["/spec/replicas"]
      target:
        kind: Deployment
  values:
    nameOverride: settlement-worker
    fullnameOverride: settlement-worker
    commonLabels:
      app: settlement-worker
    image:
      repository: nvlannasik/settlement
      registry: docker.io
    containerPorts:
      - name: main
        containerPort: 3001
    service:
      ports:
        - name: http
          port: 3001
          protocol: TCP
          targetPort: 3001
    commonAnnotations:
      configmap.reloader.stakater.com/reload: settlement-worker-configmap
      secret.reloader.stakater.com/reload: settlement-worker-secret
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "3001"
    ingress:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    externalSecret:
      enabled: false
    serviceAccount:
      create: true
      name: "settlement-worker"
      automountServiceAccountToken: true
    livenessProbe:
      enabled: true
      httpGet:
        path: /healthz
        port: 3001
      initialDelaySeconds: 50
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    readinessProbe:
      enabled: true
      httpGet:
        path: /readyz
        port: 3001
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
