apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sarang-tani-api
  namespace: flux-app
spec:
  targetNamespace: sarang-tani
  chart:
    spec:
      chart: main
      reconcileStrategy: Revision
      sourceRef:
        kind: HelmRepository
        name: github
        namespace: flux-system
  interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
    - paths: ["/spec/replicas"]
      target:
        kind: Deployment
  values:
    nameOverride: sarang-tani-api
    fullnameOverride: sarang-tani-api
    commonLabels:
      app: sarang-tani-api
    image:
      repository: nvlannasik/sarang-tani-api
      registry: docker.io
    containerPorts:
      - name: main
        containerPort: 3008
    service:
      ports:
        - name: http
          port: 3008
          protocol: TCP
          targetPort: 3008
    commonAnnotations:
      configmap.reloader.stakater.com/reload: sarang-tani-api-configmap
      secret.reloader.stakater.com/reload: sarang-tani-api-external-secret
    ingress:
      enabled: true
    resources: {}
    externalSecret:
      enabled: false
    serviceAccount:
      create: true
      name: "sarang-tani-api"
      automountServiceAccountToken: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi