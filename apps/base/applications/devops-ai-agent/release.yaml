apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: devops-ai-agent
  namespace: flux-app
spec:
  targetNamespace: devops-tools
  chart:
    spec:
      chart: main
      reconcileStrategy: Revision
      sourceRef:
        kind: HelmRepository
        name: github
        namespace: flux-system
  interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
    - paths: ["/spec/replicas"]
      target:
        kind: Deployment
  values:
    nameOverride: devops-ai-agent
    fullnameOverride: devops-ai-agent
    commonLabels:
      app: devops-ai-agent
    image:
      repository: nvlannasik/devops-ai-agent
      registry: docker.io
    containerPorts:
      - name: main
        containerPort: 3000
    service:
      ports:
        - name: http
          port: 3000
          protocol: TCP
          targetPort: 3000
    kubeVersion: "1.36.2"
    commonAnnotations:
      configmap.reloader.stakater.com/reload: devops-ai-agent-external-secret
      secret.reloader.stakater.com/reload: devops-ai-agent-external-secret
    ingress:
      enabled: false
    resources: {}
    externalSecret:
      enabled: false
    serviceAccount:
      create: true
      name: "devops-ai-agent"
      automountServiceAccountToken: true
