apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: devops-ai-stack
  namespace: flux-app
spec:
  targetNamespace: devops-tools
  chart:
    spec:
      chart: devops-ai-stack
      reconcileStrategy: Revision
      sourceRef:
        kind: HelmRepository
        name: github
        namespace: flux-system
      version: "0.2.1"
  interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
    - paths: ["/spec/replicas"]
      target:
        kind: Deployment
  values:
    global:
      # The redis subchart's exporter runs a non-Bitnami image (its own default tag is gone
      # from the registry — see the `redis.metrics` block below). Bitnami charts refuse to
      # render an unrecognised image without this, and the refusal surfaces as a Flux
      # HelmRelease failure, not as a bad pod. Subcharts read only their own values plus
      # `global`, so it has to live here rather than under `redis:`.
      security:
        allowInsecureImages: true
      sqs:
        responseQueue: "private-llm-response.fifo"
        requestDlq: "private-llm-request-dlq.fifo"
        gitopsRequestQueue: "gitops-request.fifo"
      aws:
        region: "ap-southeast-1"
        authMode: "iam-anywhere"
        rolesAnywhere:
          configSecret:
            name: aws-rolesanywhere-config
          trustAnchorArnKey: "trust-anchor-arn"
          profileArnKey: "profile-arn"
          roleArnKey: "role-arn"
        certificate:
          create: false
          secretName: "workload-tls"
          mountPath: "/certs"
          name: "workload-cert"
          issuerRef:
            name: "workload-ca-issuer"
            kind: ClusterIssuer
          duration: "720h"
          renewBefore: "48h"
          privateKey:
            algorithm: RSA
            size: 2048
            rotationPolicy: Always
          usages:
            - digital signature
            - key encipherment
            - client auth
      redis:
        enabled: true
        fullnameOverride: "redis"

    devops-ai-agent:
      enabled: true
      image:
        registry: docker.io
        repository: nvlannasik/devops-ai-agent
        pullPolicy: Always

      commonAnnotations:
        configmap.reloader.stakater.com/reload: devops-agent-secret
        secret.reloader.stakater.com/reload: devops-agent-secret

      mcp:
        transport: "http"
        serviceName: devops-mcp-server
        namespace: devops-tools
        port: 3000
        authTokenSecret:
          name: devops-agent-secret
          key: DASHBOARD_PASSWORD

      slack:
        existingSecret: devops-agent-secret
        botTokenKey: "SLACK_BOT_TOKEN"
        signingSecretKey: "SLACK_SIGNING_SECRET"
        appTokenKey: "SLACK_APP_TOKEN"

      alertWebhook:
        existingSecret: devops-agent-secret
        tokenKey: "ALERT_WEBHOOK_TOKEN"

      llm:
        provider: "router"
        backends:
          - name: haiku
            kind: claude
            baseUrl: "https://api.anthropic.com/v1"
            model: claude-haiku-4-5
            existingSecret: devops-agent-secret
            apiKeyKey: CLAUDE_KEY
          - name: chatgpt
            kind: openai-compatible
            baseUrl: "https://api.openai.com/v1"
            model: gpt-5-nano-2025-08-07
            existingSecret: devops-agent-secret
            apiKeyKey: OPENAI_KEY
          - name: deepseek
            kind: openai-compatible
            baseUrl: "https://api.deepseek.com"
            model: deepseek-v4-flash
            existingSecret: devops-agent-secret
            apiKeyKey: DEEPSEEK_KEY
          - name: private-llm-agus
            kind: private-llm
            requestQueue: "private-llm-request.fifo"
            externalWorker: true
            contextTokens: 128000
            model: agus
          - name: private-llm-chatgpt
            kind: private-llm
            requestQueue: "private-llm-chatgpt-request.fifo"
            contextTokens: 128000
            model: gpt-5-nano-2025-08-07
        routes: {}
        sqs:
          timeoutSeconds: 240
          pollWaitSeconds: 20

      investigation:
        maxConcurrent: 5

      gitops:
        enabled: true
        timeoutSeconds: 240

      database:
        host: "postgresql.postgresql"
        port: 5432
        name: "devops_agent"
        username: "postgres"
        existingSecret: devops-agent-secret
        passwordKey: "DB_PASSWORD"

      redis:
        enabled: true
        host: "redis-master.redis"
        port: 6379
        db: 0
        tls: false
        username: ""
        existingSecret: "devops-agent-secret"
        passwordKey: "REDIS_PASSWORD"

      dashboard:
        enabled: true
        port: 3001
        existingSecret: devops-agent-secret
        passwordKey: "DASHBOARD_PASSWORD"

      env: {}
      extraVolumes:
        - name: tmp
          emptyDir: {}
      extraVolumeMounts:
        - name: tmp
          mountPath: /tmp
      ingress:
        enabled: true
        className: "nginx"
        annotations: 
          cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
          ingress.kubernetes.io/rewrite-target: /
          nginx.ingress.kubernetes.io/ssl-redirect: "false"
        hosts: 
          - host: agent.annasik.cloud
            paths:
              - path: /
                pathType: Prefix
                port: 3001
        tls: 
          - hosts: 
              - agent.annasik.cloud
            secretName: ai-agent-tls
      resources: 
        limits: 
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 128m
          memory: 128Mi

    devops-mcp-server:
      enabled: true
      image:
        registry: docker.io
        repository: nvlannasik/devops-mcp-server
        pullPolicy: Always

      mcp:
        transport: "http"
        authTokenSecret:
          name: devops-agent-secret
          key: DASHBOARD_PASSWORD

      kubernetes:
        authMode: "incluster"

      prometheus:
        url: "http://monitoring-prometheus-server.monitoring:80"
      loki:
        url: "http://loki.monitoring.svc.cluster.local:3100"
      tracing:
        backend: "jaeger"
        url: "http://jaeger.monitoring.svc.cluster.local:16686"
      alertmanager:
        url: "http://alertmanager.monitoring.svc.cluster.local:9093"
        existingSecret: "devops-agent-secret"
        usernameKey: "ALERTMANAGER_USERNAME"
        passwordKey: "ALERTMANAGER_PASSWORD"

      writeTools:
        enabled: true
        allowedNamespaces:
          - default
          - flux-system
          - flux-app
          - nginx-ingress
          - default
          - monitoring
          - headlamp
          - sarang-tani
          - devops-tools
          - oauth2-proxy
          - sample-apps
        maxScaleDelta: 5
      env:
        NODE_ENV: "dev"

      rbac:
        create: true
        readOnly: true
        allowWrite: true
        allowFluxReconcile: true

      resources: 
        limits: 
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 256Mi

    devops-llm-worker:
      enabled: true
      requestQueue: "private-llm-chatgpt-request.fifo"
      image:
        registry: docker.io
        repository: nvlannasik/llm-worker
        pullPolicy: Always

      llm:
        apiFormat: "openai"
        baseUrl: "https://api.openai.com/v1"
        model: "gpt-5-nano-2025-08-07"
        maxTokens: 16384
        useMaxCompletionTokens: true
        existingSecret: llm-api-key-secret
        apiKeyKey: api-key
        sampling:
          reasoningEffort: high
      sqs:
        pollWaitSeconds: 20
        maxMessages: 10
      gitops:
        enabled: true
        repo: "nvlannasik/gitops-devops-ai-manifest"
        branch: "main"
        apiUrl: "https://api.github.com"
        auth:
          tokenSecret:
            name: github-token-secret
            key: token

      resources: 
        limits: 
          cpu: 256m
          memory: 256Mi
        requests:
          cpu: 128m
          memory: 64Mi

      extraVolumes:
        - name: tmp
          emptyDir: {}
      extraVolumeMounts:
        - name: tmp
          mountPath: /tmp


    redis:
      namespaceOverride: "redis"
      fullnameOverride: "redis"
      architecture: standalone
      auth:
        enabled: true
        existingSecret: "redis-secret"
        existingSecretPasswordKey: "redis-password"
      master:
        persistence:
          enabled: true
          storageClass: longhorn
          size: 1Gi
      image:
        tag: latest
      metrics:
        enabled: true
        # NOT the chart default (bitnami/redis-exporter:1.70.0-debian-12-r2). That tag is gone
        # from the registry — `docker manifest inspect` returns not-found — so metrics.enabled
        # with default values yields an ImagePullBackOff sidecar and a Redis pod that never
        # becomes Ready again. oliver006 is the upstream image Bitnami repackages; same binary,
        # same metric names.
        image:
          registry: docker.io
          repository: oliver006/redis_exporter
          tag: v1.70.0
        # Unlike postgres above, no podAnnotations are needed: this chart already defaults
        # metrics.podAnnotations to prometheus.io/scrape + port 9121 on the master pod, which
        # the built-in `kubernetes-pods` job reads directly.
        #
        # The `nano` preset asks for 100m CPU and 128Mi on a Redis already throttled 33% of
        # the time.
        resourcesPreset: "none"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
