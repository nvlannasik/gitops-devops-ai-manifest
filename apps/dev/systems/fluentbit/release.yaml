apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluentbit
  namespace: flux-system
spec:
  values:
    image:
      tag: "5.0.9"
    config:
      # dev's own logs carry cluster=dev, the label multi-cluster routes on (stg's arrive with
      # cluster=stg). The rest is base's [OUTPUT] unchanged — this string replaces it whole.
      outputs: |
        [OUTPUT]
            Name        loki
            Match       kube.*
            Host        loki.monitoring.svc.cluster.local
            Port        3100
            Labels      cluster=dev, job=$k8s_job, namespace=$kubernetes['namespace_name'], app=$k8s_app, container=$kubernetes['container_name'], pod=$kubernetes['pod_name'], stream=$stream
            Remove_keys kubernetes
            Auto_kubernetes_labels off
