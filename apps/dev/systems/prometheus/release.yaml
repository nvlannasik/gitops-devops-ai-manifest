apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: flux-system
spec:
  values:
    server:
      replicaCount: 1
      image:
        tag: "v3.13.0"
      # The central Prometheus: workload clusters (stg) remote_write into it. The receiver is
      # reached on the LAN LoadBalancer in systems/central-ingest, and blocked on the public
      # Ingress below — a public write endpoint would let anyone inject series, and with them
      # alerts the agent would investigate. web.enable-lifecycle is the chart default, restated
      # because extraFlags replaces the list.
      extraFlags:
        - web.enable-lifecycle
        - web.enable-remote-write-receiver
      ingress:
        extraPaths:
          - path: /api/v1/write
            pathType: Exact
            backend:
              service:
                name: prometheus-write-blocked
                port:
                  number: 80
    serviceAccounts:
      server:
        create: true
        name: "prometheus"
        annotations: {}

    scrapeConfigs:
      prometheus:
        enabled: false
      kubernetes-api-servers:
        enabled: false
      kubernetes-nodes:
        enabled: false
      kubernetes-service-endpoints-slow:
        enabled: false
      kubernetes-service-endpoints:
        enabled: false
      # Replaced by the custom `kubernetes-cadvisor` job below (it adds `node`). Left on, every
      # container had two usage series and anything summing them doubled — measured 2026-09-28,
      # k8s_recommend_resources reported CPU at 2x.
      kubernetes-nodes-cadvisor:
        enabled: false
      # The chart's own jobs, kept on, with one rule added: every dev series is labelled cluster=dev,
      # the label multi-cluster routes on (stg's arrive with cluster=stg from its external_labels).
      # Helm REPLACES a list, so each relabel_configs is chart 29.14.0's default copied whole plus
      # that rule — re-copy on a chart bump.
      kubernetes-pods:
        relabel_configs:
        - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_scrape
          action: keep
          regex: true
        - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow
          action: drop
          regex: true
        - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_scheme
          action: replace
          regex: (https?)
          target_label: __scheme__
        - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_path
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_port
          - __meta_kubernetes_pod_ip
          action: replace
          regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
          replacement: '[$2]:$1'
          target_label: __address__
        - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_port
          - __meta_kubernetes_pod_ip
          action: replace
          regex: (\d+);((([0-9]+?)(\.|$)){4})
          replacement: $2:$1
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
          replacement: __param_$1
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels:
          - __meta_kubernetes_namespace
          action: replace
          target_label: namespace
        - source_labels:
          - __meta_kubernetes_pod_name
          action: replace
          target_label: pod
        - source_labels:
          - __meta_kubernetes_pod_phase
          regex: Pending|Succeeded|Failed|Completed
          action: drop
        - source_labels:
          - __meta_kubernetes_pod_node_name
          action: replace
          target_label: node
        - target_label: cluster
          replacement: dev
          action: replace
      kubernetes-pods-slow:
        relabel_configs:
        - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow
          action: keep
          regex: true
        - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_scheme
          action: replace
          regex: (https?)
          target_label: __scheme__
        - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_path
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_port
          - __meta_kubernetes_pod_ip
          action: replace
          regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
          replacement: '[$2]:$1'
          target_label: __address__
        - source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_port
          - __meta_kubernetes_pod_ip
          action: replace
          regex: (\d+);((([0-9]+?)(\.|$)){4})
          replacement: $2:$1
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
          replacement: __param_$1
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels:
          - __meta_kubernetes_namespace
          action: replace
          target_label: namespace
        - source_labels:
          - __meta_kubernetes_pod_name
          action: replace
          target_label: pod
        - source_labels:
          - __meta_kubernetes_pod_phase
          regex: Pending|Succeeded|Failed|Completed
          action: drop
        - source_labels:
          - __meta_kubernetes_pod_node_name
          action: replace
          target_label: node
        - target_label: cluster
          replacement: dev
          action: replace
      kubernetes-services:
        relabel_configs:
        - source_labels:
          - __meta_kubernetes_service_annotation_prometheus_io_probe
          action: keep
          regex: true
        - source_labels:
          - __address__
          target_label: __param_target
        - target_label: __address__
          replacement: blackbox
        - source_labels:
          - __param_target
          target_label: instance
        - action: labelmap
          regex: __meta_kubernetes_service_label_(.+)
        - source_labels:
          - __meta_kubernetes_namespace
          target_label: namespace
        - source_labels:
          - __meta_kubernetes_service_name
          target_label: service
        - target_label: cluster
          replacement: dev
          action: replace
      prometheus-pushgateway:
        relabel_configs:
        - source_labels:
          - __meta_kubernetes_service_annotation_prometheus_io_probe
          action: keep
          regex: pushgateway
        - target_label: cluster
          replacement: dev
          action: replace

    serverFiles:
      prometheus.yml:
        scrape_configs:
          - job_name: "kubernetes-kubelet-monitoring"
            scheme: https
            scrape_interval: 15s
            honor_labels: true
            honor_timestamps: true
            metrics_path: /metrics
            tls_config:
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
                namespaces:
                  names:
                    - kube-system
            relabel_configs:
              - target_label: cluster_name
                replacement: "kubernetes-cluster-dev"
                action: replace
              - target_label: cluster
                replacement: dev
                action: replace
              - source_labels: [__meta_kubernetes_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_node_address_InternalIP]
                target_label: node_ip
              - source_labels:
                  [
                    __meta_kubernetes_node_label_beta_kubernetes_io_instance_type,
                  ]
                target_label: node_type
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: ^kubelet_volume.*$
                replacement: $1
                action: keep

          - job_name: "kubernetes-core-dns"
            scheme: http
            scrape_interval: 15s
            honor_labels: true
            honor_timestamps: true
            metrics_path: /metrics
            static_configs:
              - targets: ["kube-dns.kube-system.svc.cluster.local:9153"]
            relabel_configs:
              - target_label: cluster
                replacement: dev
                action: replace

          - job_name: "kubernetes-cadvisor"
            scheme: https
            scrape_interval: 15s
            honor_labels: true
            honor_timestamps: true
            metrics_path: /metrics/cadvisor
            tls_config:
              insecure_skip_verify: true
            bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            kubernetes_sd_configs:
              - role: node
                namespaces:
                  names:
                    - kube-system
            relabel_configs:
              - target_label: cluster_name
                replacement: "kubernetes-cluster-dev"
                action: replace
              - target_label: cluster
                replacement: dev
                action: replace
              - source_labels: [__meta_kubernetes_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_node_address_InternalIP]
                target_label: node_ip
              - source_labels:
                  [
                    __meta_kubernetes_node_label_beta_kubernetes_io_instance_type,
                  ]
                target_label: node_type
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: container_(network_tcp_usage_total|network_udp_usage_total|tasks_state|cpu_load_average_10s)
                replacement: $1
                action: drop

          - job_name: "kube-state-metrics"
            scheme: http
            scrape_interval: 15s
            honor_labels: true
            honor_timestamps: true
            metrics_path: /metrics
            static_configs:
              - targets:
                  [
                    "kube-state-metrics.kube-system.svc.cluster.local:8080",
                  ]
            relabel_configs:
              - target_label: cluster_name
                replacement: "kubernetes-cluster-dev"
                action: replace
              - target_label: cluster
                replacement: dev
                action: replace
              - source_labels: [__meta_kubernetes_node_name]
                target_label: node
              - source_labels: [__meta_kubernetes_node_address_InternalIP]
                target_label: node_ip
              - source_labels:
                  [
                    __meta_kubernetes_node_label_beta_kubernetes_io_instance_type,
                  ]
                target_label: node_type

          - job_name: "prometheus-node-exporter"
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names:
                    - monitoring
            relabel_configs:
              - source_labels: [__meta_kubernetes_endpoints_name]
                regex: "monitoring-prometheus-prometheus-node-exporter"
                action: keep
              - target_label: cluster
                replacement: dev
                action: replace
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 512Mi