apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: devops-ai-stack
  namespace: flux-app
spec:
  values:
    # OpenTelemetry from the agent, the MCP server and the llm-worker into the dev Jaeger (chart
    # 0.8.0; spec devops-ai-agent/docs/superpowers/specs/2026-10-27-otel-tracing-design.md). The
    # Jaeger UI is behind the oauth2-proxy login (apps/base/systems/jaeger/release.yaml).
    global:
      tracing:
        enabled: true
        endpoint: "http://jaeger.monitoring.svc.cluster.local:4318"

    devops-ai-agent:
      image:
        tag: latest

      mcp:
        authTokenSecret:
          name: devops-agent-secret
          key: DASHBOARD_PASSWORD

      slack:
        alertChannel: "C09R0F6F891"
        oncallUsers: ["U0BGYRD1EPM"]
        approverUsers: ["U0BGYRD1EPM"]
        allowedUsers: ["U0BGYRD1EPM"]

      llm:
        routes:
          heavy: [deepseek, chatgpt]
          light: [private-llm-agus, private-llm-chatgpt]

      env:
        NODE_ENV: "dev"
        INCIDENT_RECONCILE_ENABLED: "true"
        SUBAGENT_ENABLED: "true"
        INVESTIGATION_TIMEOUT_SECONDS: 600
        SUBAGENT_MAX_ITERATIONS: 3
        SUBAGENT_TOOL_ROUNDS: 2

      dashboard:
        publicUrl: "https://agent.annasik.cloud"
        tracingUiUrl: "https://jaeger.annasik.cloud"

      ingress:
        annotations: 
          cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
          ingress.kubernetes.io/rewrite-target: /
          nginx.ingress.kubernetes.io/ssl-redirect: "false"
        hosts: 
          - host: agent.annasik.cloud
            paths:
              - path: /
                pathType: Prefix
                port: 3001
        tls: 
          - hosts: 
              - agent.annasik.cloud
            secretName: ai-agent-tls

    devops-mcp-server:
      image:
        tag: latest

    devops-llm-worker:
      serviceAccount:
        create: true
        name: devops-llm-worker

      env:
        NODE_ENV: "dev"

      image:
        tag: latest