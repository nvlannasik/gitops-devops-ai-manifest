apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: storefront
  namespace: flux-app
spec:
  chart:
    spec:
      version: 1.0.1
  values:
    image:
      tag: latest
    extraEnvVars:
      - name: SERVICE_VERSION
        value: latest
      - name: DEPLOYMENT_ENV
        value: dev
      - name: GATEWAY_URL
        value: https://api.annasik.cloud
      - name: LOADGEN_UI_URL
        value: "https://loadgen.annasik.cloud"
      - name: GATEWAY_AUTH_TOKEN
        valueFrom:
          secretKeyRef:
            name: checkout-gateway-secret
            key: GATEWAY_AUTH_TOKEN
    secret:
      enabled: false
    replicaCount: 1
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    loggingOperator:
      enabled: false
    secretStore:
      enabled: false
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-cluster-issuer
        ingress.kubernetes.io/rewrite-target: /
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
      hostname: web.annasik.cloud
      apiVersion: "networking.k8s.io/v1"
      pathType: Prefix
      path: /
      tls: true
      selfSigned: true
